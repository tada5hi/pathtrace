<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="pathtrace-b-title pathtrace-b-desc">
<title id="pathtrace-b-title">pathtrace — The selected branch</title>
<desc id="pathtrace-b-desc">A stepped object outline leads through nested keys to a selected leaf; an unselected sibling remains faint.</desc>
<style>
:root{--accent:#168c76;--second:#c98b22;--ink:#253447;--paper:#f7fafc;--line:#8394a7;--wash:#168c7618}
@media(prefers-color-scheme:dark){:root{--ink:#e4ebf3;--paper:#182332;--line:#8495aa;--wash:#168c7622}}
.a{stroke:var(--accent)}.b{stroke:var(--second)}.af{fill:var(--accent)}.bf{fill:var(--second)}.ink{fill:var(--ink)}.paper{stroke:var(--line)}.line{stroke:var(--line)}.wash{fill:var(--wash)}.white{fill:#fff}.neutral{fill:var(--paper)}
</style>
